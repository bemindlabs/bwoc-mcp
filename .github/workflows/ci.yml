name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a new bwoc release that breaks a tool's argv is caught even
  # when nothing changes here (the cli-contract job checks the latest release).
  schedule:
    - cron: "17 3 * * *"

# Least privilege: every job only reads the repo (and public release assets).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: build + test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (default)
        run: cargo build --verbose
      - name: build (http feature)
        run: cargo build --features http --verbose
      - name: test (all features)
        # Behavioural tests are unix-only (POSIX stub); on Windows this still
        # compiles the test crate and runs zero cases.
        run: cargo test --all-features --verbose

  cli-contract:
    name: CLI contract (latest bwoc release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install the latest bwoc release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R bemindlabs/BWOC-Framework \
            --pattern '*-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/bwoc-*.tar.gz -C "$RUNNER_TEMP"
          bin="$(ls -d "$RUNNER_TEMP"/bwoc-*-x86_64-unknown-linux-gnu)/bwoc"
          "$bin" --version
          echo "BWOC_CONTRACT_BIN=$bin" >> "$GITHUB_ENV"
      - name: every tool and resource builds an argv the CLI accepts
        run: cargo test --test cli_contract -- --nocapture
